<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside the atom: student dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f6;--sf:#fff;--ink:#14213d;--mu:#55647c;--ln:#d2dbe6;--ac:#1d6fe0;--ok:#14895a;--bad:#c4373a;--p:#e4572e;--n:#8d99ae;--e:#2a7de1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--sf:#131d33;--ink:#e8eefb;--mu:#9aabc6;--ln:#27354f;--ac:#6aa5ff;--ok:#41c98c;--bad:#ff8080}}
:root[data-theme="dark"]{--bg:#0a1120;--sf:#131d33;--ink:#e8eefb;--mu:#9aabc6;--ln:#27354f;--ac:#6aa5ff;--ok:#41c98c;--bad:#ff8080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.top p{margin:0;color:var(--mu);max-width:44ch}
.prog{display:flex;gap:18px}
.prog div{min-width:130px;font-size:.88rem;color:var(--mu)}
.prog b{color:var(--ink);font-size:1.15rem}
.prog i{display:block;height:6px;border-radius:3px;background:var(--ln);margin-top:5px;overflow:hidden}
.prog u{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.stage{background:radial-gradient(circle at 50% 45%,#1a2d57,#0a1226 75%);border-radius:22px;padding:12px;color:#e8eefb;align-self:start}
#atom{width:100%;height:auto;display:block;max-height:560px}
[data-part]{cursor:pointer;transition:opacity .25s}
#atom[data-hl] [data-part]{opacity:.18}
#atom[data-hl=proton] [data-part=proton],#atom[data-hl=neutron] [data-part=neutron],#atom[data-hl=electron] [data-part=electron],#atom[data-hl=shell] [data-part=shell],#atom[data-hl=nucleus] [data-part=proton],#atom[data-hl=nucleus] [data-part=neutron],#atom[data-hl=nucleus] [data-part=nucleus]{opacity:1}
.orb{transform-origin:200px 200px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.picker{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:6px}
.picker button{border:1px solid #2c4170;background:#12213f;color:#e8eefb;border-radius:8px;padding:5px 0 4px;font-weight:600;font-size:.95rem;cursor:pointer;line-height:1.1}
.picker small{display:block;font-weight:400;font-size:.65rem;opacity:.7}
.picker button[aria-pressed=true]{background:#e8eefb;color:#0a1226}
.cap{margin:10px 4px 2px;font-size:.88rem;color:#9fb2d6}
.nuc{display:flex;align-items:center;gap:6px;font-weight:800;font-size:4.2rem;line-height:1}
.ab{display:flex;flex-direction:column;font-size:1.1rem;line-height:1.15;color:var(--mu);font-weight:600;text-align:right}
.cg{align-self:flex-start;font-size:1.6rem;color:var(--ac)}
.kind{margin:.5rem 0 0;font-weight:600;font-size:1.2rem}
.say{color:var(--mu);margin:.3rem 0 12px;max-width:52ch}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles div{border-left:4px solid var(--c);padding:2px 0 2px 8px}
.tiles b{display:block;font-size:1.5rem;line-height:1.1}
.tiles span{font-size:.82rem;color:var(--mu)}
.build{margin:16px 0;border:1px solid var(--ln);border-radius:14px;background:var(--sf);display:grid;grid-template-columns:repeat(3,1fr)}
.st{padding:10px;text-align:center;border-right:1px solid var(--ln)}
.st:last-child{border:0}
.st label{font-size:.88rem;color:var(--mu)}
.st label::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.st div{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.st output{min-width:2ch;font-weight:800;font-size:1.5rem}
.st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);font-size:1.2rem;cursor:pointer}
.parts{border:1px solid var(--ln);border-radius:14px;background:var(--sf);padding:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.ex::after{content:' ✓';color:var(--ok)}
#info{margin-top:12px;min-height:130px}
#info h3{margin:0 0 4px;font-size:1.2rem}
#info p{margin:0}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0 0;font-size:.92rem}
#info dt{color:var(--mu)}
#info dd{margin:0}
.learn{display:grid;gap:20px;margin-top:24px}
@media(min-width:760px){.learn{grid-template-columns:1fr 1.4fr}}
h2{font-size:1.3rem;margin:0 0 8px}
.ch{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ch li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.ch li::before{content:'';flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;border:2px solid var(--mu);color:#fff;font-size:.7rem;line-height:1}
.ch li.ok{border-color:var(--ok)}
.ch li.ok::before{content:'✓';background:var(--ok);border-color:var(--ok)}
.quiz{border:1px solid var(--ln);border-radius:14px;background:var(--sf);padding:16px}
.quiz p{margin:.3rem 0}
.mu{color:var(--mu);font-size:.88rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);cursor:pointer}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.go{margin-top:8px;padding:9px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div><h1>Inside the atom</h1><p>Build an atom, tap its parts, and test what you’ve learned.</p></div>
 <div class="prog" aria-live="polite">
  <div><b id="pe">0/5</b> parts explored<i><u id="pb"></u></i></div>
  <div><b id="pq">–</b> best quiz score<i><u id="qb"></u></i></div>
 </div>
</header>
<main class="grid">
 <section class="stage" aria-label="Atom model">
  <svg id="atom" viewBox="0 0 400 400" role="img"></svg>
  <div class="picker" id="pick" role="group" aria-label="Choose an element"></div>
  <p class="cap">Pick an element, or use the proton, neutron and electron buttons to build your own.</p>
 </section>
 <section aria-label="Atom details">
  <div id="read"></div>
  <div class="build" role="group" aria-label="Build your own atom">
   <div class="st" style="--c:var(--p)"><label>Protons</label><div><button aria-label="Remove a proton" onclick="step('p',-1)">−</button><output id="vp"></output><button aria-label="Add a proton" onclick="step('p',1)">+</button></div></div>
   <div class="st" style="--c:var(--n)"><label>Neutrons</label><div><button aria-label="Remove a neutron" onclick="step('n',-1)">−</button><output id="vn"></output><button aria-label="Add a neutron" onclick="step('n',1)">+</button></div></div>
   <div class="st" style="--c:var(--e)"><label>Electrons</label><div><button aria-label="Remove an electron" onclick="step('e',-1)">−</button><output id="ve"></output><button aria-label="Add an electron" onclick="step('e',1)">+</button></div></div>
  </div>
  <div class="parts">
   <div class="tabs" id="tabs" role="group" aria-label="Parts of the atom"></div>
   <div id="info" aria-live="polite"></div>
  </div>
 </section>
</main>
<section class="learn">
 <div><h2>Build challenges</h2><ul class="ch" id="ch"></ul></div>
 <div class="quiz" id="qz"></div>
</section>
</div>
<script>
const EL='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar'.split(' '),
NM='Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminium Silicon Phosphorus Sulfur Chlorine Argon'.split(' '),
MA=[1,4,7,9,11,12,14,16,19,20,23,24,27,28,31,32,35,40],R=[88,125,160],$=id=>document.getElementById(id);
const PARTS={
proton:{n:'Proton',ch:'+1',ms:'1 unit',loc:'In the nucleus',t:'Protons carry a positive charge. The number of protons is the atomic number, and it decides which element the atom is.'},
neutron:{n:'Neutron',ch:'0 (none)',ms:'1 unit',loc:'In the nucleus',t:'Neutrons have no charge. They add mass and help hold the nucleus together. Changing the neutron count makes a different isotope.'},
electron:{n:'Electron',ch:'−1',ms:'about 1/1836 of a proton',loc:'Outside the nucleus, in shells',t:'Electrons are tiny, negative and always moving. Their number compared with the protons sets the atom’s charge.'},
nucleus:{n:'Nucleus',ch:'Positive',ms:'Nearly all of the atom’s mass',loc:'Centre of the atom',t:'The dense core made of protons and neutrons. It is roughly 100,000 times smaller across than the whole atom.'},
shell:{n:'Electron shell',ch:'n/a',ms:'n/a',loc:'Rings around the nucleus',t:'Shells are energy levels. In this simplified model the first holds up to 2 electrons, then 8, then 8 more.'}};
const CH=[['Build a neutral helium atom: 2 protons, 2 neutrons, 2 electrons.',s=>s.p==2&&s.n==2&&s.e==2],['Make a lithium ion with a +1 charge.',s=>s.p==3&&s.e==2],['Build carbon-14, a heavier isotope of carbon.',s=>s.p==6&&s.n==8&&s.e==6]];
const Q=[
['Which particle has a negative charge?',['Proton','Neutron','Electron'],2,'Electrons carry −1. Protons are +1 and neutrons have no charge.'],
['What decides which element an atom is?',['Number of protons','Number of neutrons','Number of electrons'],0,'The proton count is the atomic number. Change it and you have a different element.'],
['A neutral atom has 6 protons. How many electrons does it have?',['3','6','12'],1,'Neutral means the charges cancel, so electrons equal protons.'],
['Where are protons and neutrons found?',['In the nucleus','In the outer shells','Spread evenly through the atom'],0,'Both sit together in the dense nucleus at the centre.'],
['Atoms of one element with different numbers of neutrons are called…',['Ions','Isotopes','Molecules'],1,'Isotopes share a proton count but differ in neutrons, so their mass numbers differ.']];
let st={};try{st=JSON.parse(localStorage.getItem('atomdash')||'{}')}catch(e){}
const ex=new Set(st.ex||[]),dn=new Set(st.dn||[]);let best=st.best??null,sel=null,qi=0,sc=0;
const save=()=>{try{localStorage.setItem('atomdash',JSON.stringify({ex:[...ex],dn:[...dn],best}))}catch(e){}};
const s={p:6,n:6,e:6};
const sh=()=>{const c=[];let l=s.e;[2,8,8].forEach(x=>{const k=Math.min(x,l);l-=k;if(k)c.push(k)});return c};
function setEl(z){s.p=z;s.n=MA[z-1]-z;s.e=z;render()}
function step(k,d){const m={p:[1,18],n:[0,24],e:[0,18]}[k];s[k]=Math.min(m[1],Math.max(m[0],s[k]+d));render()}
function draw(){
 let h='';
 R.forEach(r=>{h+=`<circle data-part="shell" cx="200" cy="200" r="${r}" fill="none" stroke="#6f86b8" stroke-opacity=".55" stroke-dasharray="3 6"/><circle data-part="shell" cx="200" cy="200" r="${r}" fill="none" stroke="transparent" stroke-width="16"/>`});
 let left=s.e;
 [2,8,8].forEach((c,i)=>{const k=Math.min(c,left);left-=k;if(!k)return;
  h+=`<g class="orb" style="animation-duration:${16+i*10}s;animation-direction:${i==1?'reverse':'normal'}">`;
  for(let j=0;j<k;j++){const a=2*Math.PI*j/k+i*.6;h+=`<circle data-part="electron" cx="${(200+R[i]*Math.cos(a)).toFixed(1)}" cy="${(200+R[i]*Math.sin(a)).toFixed(1)}" r="6.5" fill="#2a7de1" stroke="#cfe3ff" stroke-width="1.5"/>`}
  h+='</g>'});
 const tot=s.p+s.n;
 h+=`<circle data-part="nucleus" cx="200" cy="200" r="${(8.6*Math.sqrt(tot)+12).toFixed(1)}" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".3"/>`;
 let a=s.p,b=s.n;const arr=[];
 while(a||b){if(a/s.p>=b/(s.n||1)){arr.push(1);a--}else{arr.push(0);b--}}
 arr.forEach((t,i)=>{const r=8.6*Math.sqrt(i),an=i*2.39996,x=(200+r*Math.cos(an)).toFixed(1),y=(200+r*Math.sin(an)).toFixed(1);
  h+=t?`<g data-part="proton"><circle cx="${x}" cy="${y}" r="8" fill="#e4572e" stroke="#ffd1c2"/><text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">+</text></g>`:`<circle data-part="neutron" cx="${x}" cy="${y}" r="8" fill="#8d99ae" stroke="#e1e6ee"/>`});
 const svg=$('atom');svg.innerHTML=h;
 svg.setAttribute('aria-label',`${NM[s.p-1]}-${tot} atom model with ${s.p} protons, ${s.n} neutrons and ${s.e} electrons`);
}
function readout(){
 const {p,n,e}=s,A=p+n,net=p-e,nm=NM[p-1],iso=n!=MA[p-1]-p,
 cg=net?(Math.abs(net)>1?Math.abs(net):'')+(net>0?'+':'−'):'',cfg=sh();
 const say=`${p} proton${p>1?'s make':' makes'} this ${nm.toLowerCase()}. `+(net==0?`With ${e} electron${e==1?'':'s'} to balance ${p>1?'them':'it'}, the atom is neutral. `:net>0?`It has ${net} fewer electron${net>1?'s':''} than protons, so it’s a positive ion. `:`It has ${-net} more electron${-net>1?'s':''} than protons, so it’s a negative ion. `)+(iso?`Its ${n} neutron${n==1?'':'s'} make it an isotope.`:'');
 $('read').innerHTML=`<div class="nuc"><span class="ab"><span>${A}</span><span>${p}</span></span><span>${EL[p-1]}</span><span class="cg">${cg}</span></div>
 <p class="kind">${nm}-${A}</p><p class="say">${say}<br>Electrons by shell: ${cfg.join(', ')||'none'}.</p>
 <div class="tiles"><div style="--c:var(--p)"><b>${p}</b><span>Protons</span></div><div style="--c:var(--n)"><b>${n}</b><span>Neutrons</span></div><div style="--c:var(--e)"><b>${e}</b><span>Electrons</span></div><div style="--c:var(--ac)"><b>${net>0?'+':net<0?'−':''}${Math.abs(net)}</b><span>Net charge</span></div></div>`;
 $('vp').textContent=p;$('vn').textContent=n;$('ve').textContent=e;
 document.querySelectorAll('#pick button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.z==p));
}
function chal(){
 CH.forEach((c,i)=>{if(c[1](s)&&!dn.has(i)){dn.add(i);save()}});
 $('ch').innerHTML=CH.map((c,i)=>`<li class="${dn.has(i)?'ok':''}">${c[0]}</li>`).join('');
}
function info(){
 const q=PARTS[sel],cnt={proton:s.p,neutron:s.n,electron:s.e,nucleus:(s.p+s.n)+' particles',shell:sh().length+' with electrons'}[sel];
 $('info').innerHTML=q?`<h3>${q.n}</h3><p>${q.t}</p><dl><dt>Charge</dt><dd>${q.ch}</dd><dt>Mass</dt><dd>${q.ms}</dd><dt>Location</dt><dd>${q.loc}</dd><dt>In this atom</dt><dd>${cnt}</dd></dl>`:'<p class="mu">Tap any part of the atom, or pick one above, to see what it does.</p>';
 document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.k==sel);b.classList.toggle('ex',ex.has(b.dataset.k))});
 const svg=$('atom');sel?svg.setAttribute('data-hl',sel):svg.removeAttribute('data-hl');
}
function prog(){$('pe').textContent=ex.size+'/5';$('pb').style.width=ex.size*20+'%';$('pq').textContent=best==null?'–':best+'/5';$('qb').style.width=(best||0)*20+'%'}
function pick(k){sel=sel==k?null:k;if(sel){ex.add(sel);save()}info();prog()}
function render(){draw();readout();chal();if(sel)info()}
function quiz(){
 const q=$('qz');
 if(qi>=Q.length){if(best==null||sc>best){best=sc;save();prog()}
  q.innerHTML=`<h2>Quiz</h2><p><b>You scored ${sc} out of ${Q.length}.</b> ${sc==Q.length?'You know your atom parts.':'Rebuild an atom above, then try again.'}</p><button class="go" onclick="qi=0;sc=0;quiz()">Try again</button>`;return}
 const [t,o]=Q[qi];
 q.innerHTML=`<h2>Quiz</h2><p class="mu">Question ${qi+1} of ${Q.length}</p><p><b>${t}</b></p>`+o.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join('')+'<p id="fb" aria-live="polite"></p>';
}
$('qz').onclick=ev=>{const b=ev.target.closest('.opt');if(!b||b.disabled)return;
 const c=Q[qi][2],w=Q[qi][3],i=+b.dataset.i;
 document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==c)x.classList.add('right')});
 if(i==c)sc++;else b.classList.add('wrong');
 $('fb').innerHTML=`${i==c?'Correct. ':'Not quite. '}${w}<br><button class="go" onclick="qi++;quiz()">${qi==Q.length-1?'See score':'Next question'}</button>`};
$('atom').onclick=ev=>{const t=ev.target.closest('[data-part]');if(t)pick(t.dataset.part)};
$('pick').innerHTML=EL.map((x,i)=>`<button data-z="${i+1}" aria-label="${NM[i]}">${x}<small>${i+1}</small></button>`).join('');
$('pick').onclick=ev=>{const b=ev.target.closest('button');if(b)setEl(+b.dataset.z)};
$('tabs').innerHTML=Object.keys(PARTS).map(k=>`<button data-k="${k}">${PARTS[k].n}</button>`).join('');
$('tabs').onclick=ev=>{const b=ev.target.closest('button');if(b)pick(b.dataset.k)};
render();info();prog();quiz();
</script>
</body>
</html>
